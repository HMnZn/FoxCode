[project]
name = "fox-coding-agent"
version = "0.1.0"
description = "Interactive FoxCode coding-agent runtime and CLI"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fox-agent-core==0.1.0",
    "fox-ai==0.1.0",
    "pathspec>=0.12.1",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.2",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project.scripts]
fox = "fox_coding_agent.src.cli:main"

[tool.setuptools]
packages = [
    "fox_coding_agent.src",
    "fox_coding_agent.src.core",
    "fox_coding_agent.src.extensions",
    "fox_coding_agent.src.extensions.memory",
    "fox_coding_agent.src.extensions.mcp",
    "fox_coding_agent.src.extensions.skill_evolution",
    "fox_coding_agent.src.extensions.skill_evolution.fixtures",
    "fox_coding_agent.src.extensions.skill_evolution.fixtures.evolution_eval",
    "fox_coding_agent.src.extensions.subagent",
    "fox_coding_agent.src.extensions.memory.fixtures",
    "fox_coding_agent.src.extensions.memory.fixtures.memory_eval",
    "fox_coding_agent.src.extensions.memory.fixtures.memory_eval.store",
]

[tool.setuptools.package-dir]
"fox_coding_agent.src" = "src"
"fox_coding_agent.src.core" = "src/core"
"fox_coding_agent.src.extensions" = "src/extensions"
"fox_coding_agent.src.extensions.memory" = "src/extensions/memory"
"fox_coding_agent.src.extensions.mcp" = "src/extensions/mcp"
"fox_coding_agent.src.extensions.skill_evolution" = "src/extensions/skill_evolution"
"fox_coding_agent.src.extensions.subagent" = "src/extensions/subagent"

[tool.setuptools.package-data]
"fox_coding_agent.src.extensions.subagent" = ["SUBAGENT_DESIGN.md"]
"fox_coding_agent.src.extensions.mcp" = ["MCP_DESIGN.md"]
"fox_coding_agent.src.extensions.skill_evolution" = [
    "SKILL_EVOLUTION_DESIGN.md",
    "SKILL_EVOLUTION_TUTORIAL.md",
    "data/ALFWorld/*.json",
    "data/API-Bank/apis/*.py",
    "data/API-Bank/init_database/*.json",
    "data/API-Bank/lv1-lv2-samples/*.py",
    "data/API-Bank/lv1-lv2-samples/*/*.jsonl",
    "data/API-Bank/lv3_apis/*.py",
    "data/API-Bank/test-data/*.json",
    "fixtures/evolution_eval/*.json",
    "fixtures/evolution_eval/*.jsonl",
    "fixtures/evolution_eval/*.md",
    "fixtures/evolution_eval_apiword/*.json",
    "fixtures/evolution_eval_apiword/*.jsonl",
]
"fox_coding_agent.src.extensions.memory" = [
    "MEMORY_DESIGN.md",
    "MEMORY_TUTORIAL.md",
    "fixtures/memory_eval/*.json",
    "fixtures/memory_eval/*.jsonl",
    "fixtures/memory_eval/*.py",
    "fixtures/memory_eval/store/*.md",
]
