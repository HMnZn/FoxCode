[project]
name = "foxcode-workspace"
version = "0.1.0"
description = "FoxCode development workspace"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fox-ai",
    "fox-agent-core",
    "fox-coding-agent",
    "ipykernel>=7.3.0",
]

[tool.uv.workspace]
members = [
    "packages/fox_ai",
    "packages/fox_agent_core",
    "packages/fox_coding_agent",
]

[tool.uv.sources]
fox-ai = { workspace = true }
fox-agent-core = { workspace = true }
fox-coding-agent = { workspace = true }
