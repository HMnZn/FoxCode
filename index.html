<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>骑自行车的鹈鹕</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 50% 30%, #1d2a36, #0c1319 70%);
      font-family: system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    figure { margin: 0; text-align: center; }
    img {
      display: block;
      width: min(92vw, 880px);
      height: auto;
      border-radius: 18px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .55);
    }
    figcaption {
      margin-top: 16px;
      color: #9fb3c8;
      font-size: 15px;
      letter-spacing: .05em;
    }
  </style>
</head>
<body>
  <figure>
    <img src="pelican-bicycle.svg" width="800" height="600"
         alt="一只朝右行驶的鹈鹕骑着自行车，翅膀扶着车把，双脚踩在踏板上">
    <figcaption>骑自行车的鹈鹕 · Pelican on a Bicycle</figcaption>
  </figure>
</body>
</html>
